[project]
name = "usepr"
version = "0.1.15"
description = "AI-powered PR summary generator for Git repositories"
readme = "README.md"
authors = [{ name = "Edward Boswell", email = "thememium@gmail.com" }]
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

dependencies = [
  "dspy>=3.5.0",
  "pyperclip>=1.11.0",
  "pyyaml>=6.0.3",
  "usecli>=0.2.12",
]

[project.scripts]
usepr = "usecli:main"
[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "bandit>=1.9.4",
  "deptry>=0.25.1",
  "isort>=9.0.2",
  "poethepoet>=0.49.0",
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "pytest-xdist[psutil]>=3.8.0",
  "ruff>=0.17.5",
  "ty>=0.0.107",
  "usechange>=0.1.54",
]

[tool.deptry]
known_first_party = ["usepr"]

[project.urls]
Homepage = "https://github.com/thememium/usepr"
Documentation = "https://github.com/thememium/usepr"
Repository = "https://github.com/thememium/usepr.git"
Issues = "https://github.com/thememium/usepr/issues"
Changelog = "https://github.com/thememium/usepr/blob/master/CHANGELOG.md"

[tool.pytest.ini_options]
filterwarnings = ["ignore:.*prefix.*:DeprecationWarning:dspy.*"]

[tool.ty]

[tool.ty.src]
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv"]

[tool.ty.rules]
# Ty uses rule = "level" format (error, warn, ignore)
# See all rules at: https://docs.astral.sh/ty/reference/rules/

[tool.coverage.report]
fail_under = 100

[tool.poe.tasks]
dev-interactive = { cmd = "uv run usepr -i", use_exec = true }
dev = "uv run usepr"
clean-full = "sh -c 'uv run isort . && uv run ruff check . --fix && uv run ruff format . && uv run deptry . && uv run ty check'"
clean = "sh -c 'uv run isort . && uv run ruff format .'"
# xdist `-n auto` pins every core at 100%, which ramps the fans on long runs.
# PYTEST_XDIST_AUTO_NUM_WORKERS caps `auto` at half the online CPUs; override
# per run, e.g. PYTEST_XDIST_AUTO_NUM_WORKERS=4 uv run poe test.
test = "sh -c 'PYTEST_XDIST_AUTO_NUM_WORKERS=$(( ($(getconf _NPROCESSORS_ONLN) + 1) / 2 )) uv run pytest tests/ -n auto --dist worksteal -v $@' --"
test-cov = "sh -c 'PYTEST_XDIST_AUTO_NUM_WORKERS=$(( ($(getconf _NPROCESSORS_ONLN) + 1) / 2 )) uv run pytest tests/ -n auto --dist worksteal -v --cov=usepr --cov-report=term-missing $@' --"
sort = "uv run isort ."
lint = "uv run ruff check ."
format = "uv run ruff format ."
deptry = "uv deptry ."
typecheck = "uv run ty check"
release = "uv run usechange release"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["**/*.toml", "**/*.j2"]
